name: WorkBuddy 每日自动签到（多账号）

# ─────────────────────────────────────────────────────────────
#  WorkBuddy「Buddy 加油站」每日签到 · GitHub Actions 多账号版
#  原理：一份 Secret 装全部账号，编排器逐账号起独立子进程调用原签到脚本
#       （接口直签，无需 GUI、无需本机常驻、客户端不开也能跑）
#
#  唯一必填 Secret：
#    WB_ACCOUNTS_JSON — JSON 数组，形如
#      [{"name":"main","refresh_token":"<长效令牌>"},
#       {"name":"alt01","refresh_token":"<长效令牌>","domain":"www.codebuddy.cn"}]
#      name 只允许字母/数字/_/-，不可重复。
#      5.6.2+ 客户端必用 refresh_token；旧客户端可用 access_token。
#
#  单账号脚本仍保留：直接跑 scripts/workbuddy_checkin.py 即可。
# ─────────────────────────────────────────────────────────────

on:
  schedule:
    # GitHub Actions 使用 UTC 时间；北京时间 08:17 = UTC 00:17
    # 用非整点分钟避开整点排队高峰（整点 cron 实测延迟可达 6 小时以上）
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: '仅查询状态，不执行领取（首次配置建议先勾这个）'
        required: false
        default: false
        type: boolean

# 同一时间只保留一个运行实例，避免并发重复领取
concurrency:
  group: workbuddy-checkin-multi
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checkin:
    name: 多账号签到
    runs-on: ubuntu-latest
    # 逐账号串行执行，每个子进程最多 180s；账号多时按需要调大
    timeout-minutes: 20

    env:
      # 唯一凭据入口（内容永不外显）
      WB_ACCOUNTS_JSON: ${{ secrets.WB_ACCOUNTS_JSON }}
      # 通知通道（可选，任一为空则跳过该通道）
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      BARK_URL: ${{ secrets.BARK_URL }}
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      SUCCESS_NOTIFY: ${{ secrets.SUCCESS_NOTIFY }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 校验账号配置（离线、不联网、不回显令牌）
        id: guard
        run: |
          python scripts/multi_checkin.py --validate

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成推送配置（可选）
        # 仅在配置了任一通知通道时生效；未配置则静默跳过
        run: |
          python scripts/gen_notify_config.py "$HOME/.workbuddy/scripts/notify_config.json"

      - name: 执行多账号签到
        id: checkin
        # 结果写入文件而非 stdout，避免推送日志混入 JSON
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.check_only }}" = "true" ]; then
            ARGS="--check-only"
          fi
          set +e
          python scripts/multi_checkin.py --out result.json $ARGS
          rc=$?
          set -e
          echo "checkin_exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: 输出运行摘要
        if: always()
        # 只输出白名单字段，不把任何原始响应/凭据写进摘要
        run: |
          python scripts/summarize_result.py result.json >> "$GITHUB_STEP_SUMMARY"

      - name: 失败时终止任务（触发 GitHub 失败通知）
        if: steps.checkin.outcome != 'success'
        run: |
          echo "::error::有账号签到未成功（退出码 ${{ steps.checkin.outputs.checkin_exit_code }}），请查看运行摘要"
          exit 1
